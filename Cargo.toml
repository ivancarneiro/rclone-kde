[package]
name = "rclone-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
dirs = "6"
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
