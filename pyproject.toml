[tool.poetry]
name = "rclone-kde"
version = "0.1.0"
description = "Rclone Frontend for KDE Plasma"
authors = ["Antigravity <antigravity@google.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
PyQt6 = "^6.4"
aiohttp = "^3.8"
keyring = "^24.0"
dbus-python = "^1.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
black = "^23.0"
mypy = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
rclone-kde = "src.main:main"
