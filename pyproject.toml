[project]
name = "rclone-kde"
version = "0.1.0"
description = "Rclone Frontend for KDE Plasma"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.4",
    "aiohttp>=3.14.1",
    "keyring>=24.0",
]

[project.scripts]
rclone-kde = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "mypy>=1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.16",
    "bandit>=1.9.4",
    "pyqt6-stubs>=20250824",
]
