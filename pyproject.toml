[project]
name = "rclone-kde"
version = "1.3.0"
description = "Rclone Frontend for KDE Plasma"
authors = [
    { name = "Ivan Carneiro", email = "ivancarneiro@example.com" }
]
dependencies = [
    "PyQt6>=6.4",
    "aiohttp>=3.8",
    "keyring>=24.0",
]
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]
